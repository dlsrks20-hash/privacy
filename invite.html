<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리의 계절 - 파트너 초대</title>
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; max-width: 480px; margin: 0 auto; padding: 40px 20px; text-align: center; background: linear-gradient(160deg, #fff0f3 0%, #ffe4d6 50%, #fce4ec 100%); min-height: 100vh; }
    h1 { color: #e91e63; font-size: 24px; }
    p { color: #5c2434; font-size: 16px; line-height: 1.6; }
    .btn { display: inline-block; padding: 14px 32px; background: linear-gradient(135deg, #e8577d, #f48fb1); color: white; border-radius: 16px; text-decoration: none; font-weight: bold; margin: 10px; box-shadow: 0 4px 16px rgba(232,87,125,0.35); }
    .btn-store { background: linear-gradient(135deg, #757575, #9e9e9e); }
    .heart { font-size: 64px; margin: 20px 0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="heart">💕</div>
  <h1>우리의 계절 파트너 초대</h1>
  <p id="intro">앱을 실행하여 자동으로 파트너 연동을 진행합니다.<br>앱이 없으면 스토어에서 다운로드해주세요.</p>

  <p id="status" style="color: #8b5e6b; font-size: 14px; margin-top: 30px;">앱을 여는 중...</p>

  <a id="appLink" class="btn" href="#">앱에서 열기</a>
  <a id="appStoreLink" class="btn btn-store hidden" href="https://apps.apple.com/kr/app/id6773003298">App Store</a>
  <a id="playStoreLink" class="btn btn-store hidden" href="https://play.google.com/store/apps/details?id=com.lovelogbook.app">Play Store</a>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      if (!code) { document.getElementById('status').textContent = '초대 코드가 없습니다.'; return; }

      var ua = navigator.userAgent;
      var isIOS = /iPad|iPhone|iPod/.test(ua);
      var isAndroid = /android/i.test(ua);
      var isMobile = isIOS || isAndroid;

      var appUrl = 'com.lovelogbook.app://invite?code=' + encodeURIComponent(code);
      var appStoreUrl = 'https://apps.apple.com/kr/app/id6773003298';
      var playStoreUrl = 'https://play.google.com/store/apps/details?id=com.lovelogbook.app';

      var appLinkEl = document.getElementById('appLink');
      var appStoreEl = document.getElementById('appStoreLink');
      var playStoreEl = document.getElementById('playStoreLink');
      var statusEl = document.getElementById('status');
      var introEl = document.getElementById('intro');

      appLinkEl.href = appUrl;

      if (isIOS) {
        // iOS: App Store 버튼만 표시
        appStoreEl.classList.remove('hidden');
      } else if (isAndroid) {
        // Android: Play Store 버튼만 표시
        playStoreEl.classList.remove('hidden');
      } else {
        // PC / Mac: 두 스토어 모두 표시, 자동 이동 안 함
        appLinkEl.classList.add('hidden');
        appStoreEl.classList.remove('hidden');
        playStoreEl.classList.remove('hidden');
        introEl.innerHTML = '모바일 기기에서 아래 스토어 링크로 앱을 설치한 후<br>다시 초대 링크를 열어주세요.';
        statusEl.textContent = '';
        return;
      }

      // 모바일: 앱 열기 시도
      var storeUrl = isIOS ? appStoreUrl : playStoreUrl;
      var storeLabel = isIOS ? 'App Store' : 'Play Store';

      setTimeout(function() { window.location.href = appUrl; }, 200);
      setTimeout(function() {
        if (!document.hidden) {
          statusEl.textContent = '앱이 설치되어 있지 않습니다. ' + storeLabel + '로 이동합니다...';
          setTimeout(function() { window.location.href = storeUrl; }, 1500);
        }
      }, 2500);
    })();
  </script>
</body>
</html>
